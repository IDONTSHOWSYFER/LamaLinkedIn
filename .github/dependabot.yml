# Veille de sécurité automatisée des dépendances (Dependabot).
# Surveille les paquets npm des trois applications du monorepo + les actions GitHub,
# et ouvre chaque semaine des pull requests de mise à jour groupées.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/apps/extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      extension-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
