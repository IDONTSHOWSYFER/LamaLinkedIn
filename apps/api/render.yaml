services:
  - type: web
    name: lama-linked-in-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm exec prisma generate && pnpm build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_WEEKLY_ID
        sync: false
      - key: STRIPE_PRICE_MONTHLY_ID
        sync: false
      - key: STRIPE_PRICE_YEARLY_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
